<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billetto Statistics Viewer</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/Billetto-Dashboard/assets/manifest-Cz1bTjJl.json" />
    <meta name="theme-color" content="#1E293B" />
    
    <!-- iOS PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Billetto Stats" />
    <link rel="apple-touch-icon" href="https://www.billetto.se/images/icons/apple-touch-icon-192x192.png" />
    
    <!-- Scripts & Styles -->
    <script>
      // Apply theme before rendering to prevent FOUC (Flash of Unstyled Content)
      (function() {
        const theme = localStorage.getItem('billettoTheme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              'brand-primary': '#1E90FF', // DodgerBlue
              'brand-secondary': '#4A5568', // Slate-600
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'slide-up': {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.3s ease-out forwards',
              'slide-up': 'slide-up 0.3s ease-out forwards',
            }
          },
        },
      }
    </script>
    <style>
      /* CSS Variables for theming */
      :root {
        --scrollbar-track-bg: #e5e7eb; /* gray-200 */
        --scrollbar-thumb-bg: #9ca3af; /* gray-400 */
        --scrollbar-thumb-hover-bg: #6b7280; /* gray-500 */
        --responsive-table-label-color: #6b7280; /* gray-500 */
        --responsive-table-row-bg: rgba(255, 255, 255, 0.8);
        --responsive-table-row-border: #e5e7eb;
        --responsive-table-cell-border: rgba(229, 231, 235, 0.5);
        --responsive-card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
      }
      .dark {
        --scrollbar-track-bg: #1e293b; /* slate-800 */
        --scrollbar-thumb-bg: #475569; /* slate-600 */
        --scrollbar-thumb-hover-bg: #64748b; /* slate-500 */
        --responsive-table-label-color: #94a3b8; /* slate-400 */
        --responsive-table-row-bg: rgba(30, 41, 59, 0.5); /* bg-slate-800/50 */
        --responsive-table-row-border: #334155; /* slate-700 */
        --responsive-table-cell-border: rgba(71, 85, 105, 0.3); /* slate-700/30 */
        --responsive-card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.4), 0 1px 2px -1px rgba(0, 0, 0, 0.3);
      }
      
      /* Custom scrollbar for a more polished look */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track-bg); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb-bg); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover-bg); }
      
      /* Utility to hide scrollbars */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }


      /* Responsive Table to Card styles */
      @media (max-width: 767px) { /* Tailwind's `md` breakpoint */
        .responsive-table thead {
          display: none;
        }
        .responsive-table, .responsive-table tbody, .responsive-table tr {
          display: block;
        }
        .responsive-table tr {
          background-color: var(--responsive-table-row-bg);
          border-radius: 0.5rem; /* rounded-lg */
          margin-bottom: 1rem;
          border: 1px solid var(--responsive-table-row-border);
          padding: 1rem;
          box-shadow: var(--responsive-card-shadow);
        }
        .responsive-table td {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-top: 0.75rem;
          padding-bottom: 0.75rem;
          border-bottom: 1px solid var(--responsive-table-cell-border);
          text-align: right;
          white-space: normal;
          max-width: 100%;
        }
        .responsive-table td:last-child {
          border-bottom: none;
        }
        .responsive-table td::before {
          content: attr(data-label);
          font-weight: 600;
          color: var(--responsive-table-label-color);
          text-align: left;
          margin-right: 1rem;
          flex-shrink: 0;
        }
      }

      /* Styles for rendered HTML event descriptions */
      .event-description {
        line-height: 1.6;
      }
      .event-description p {
        margin-bottom: 1rem;
      }
      .event-description ul, .event-description ol {
        margin-left: 1.5rem;
        margin-bottom: 1rem;
        list-style-position: outside;
      }
      .event-description ul {
        list-style-type: disc;
      }
      .event-description ol {
        list-style-type: decimal;
      }
      .event-description a {
        color: #1E90FF; /* brand-primary */
        text-decoration: underline;
        transition: color 0.2s;
      }
      .event-description a:hover {
        color: #1872cc;
      }
      .event-description strong, .event-description b {
        font-weight: 600;
        color: #1e293b; /* slate-800 */
      }
      .dark .event-description strong, .dark .event-description b {
        color: #f1f5f9; /* slate-100 */
      }
      .dark .event-description a {
        color: #4dabff;
      }
      .dark .event-description a:hover {
        color: #82c5ff;
      }
    </style>
